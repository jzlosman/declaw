name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the Pi runtime used by the extension
        run: npm install --no-save --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
      - name: Run tests with coverage
        env:
          PI_PACKAGE_ROOT: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
        run: npm run coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Build playground
        run: npm run build:playground
